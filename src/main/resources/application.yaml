# 服务器配置
server:
  port: 8080
  # 最大 HTTP 请求大小（支持 Base64 图片）
  max-http-form-post-size: 50MB

# Flask AI service
flask:
  base-url: ${FLASK_URL:http://127.0.0.1:8001}
  timeout-ms: 120000
  # 客户端连接池（Module 5）
  client:
    connect-timeout-ms: 5000
    read-timeout-ms: 120000
    max-connections: 200
    max-connections-per-route: 50
    connection-ttl-ms: 300000
    keep-alive-ms: 60000

# AI 配置
ai:
  http:
    connect-timeout-ms: 1000
    read-timeout-ms: ${flask.timeout-ms}
    connection-request-timeout-ms: 1000
    max-connections: 200
    max-connections-per-route: 50
  rag:
    base-url: ${flask.base-url}
    timeout-ms: ${flask.timeout-ms}
    request:
      max-question-length: 1000
      default-top-k: 5
      max-top-k: 10
      default-strategy: hybrid
      knowledge-base-version: default
    cache:
      enabled: true
      ttl-seconds: 1800
      ttl-jitter-seconds: 300
      null-ttl-seconds: 300
      lock-wait-seconds: 1
      lock-lease-seconds: 10
    bulkhead:
      max-concurrent: 20
      max-wait-ms: 100
  # AI 缓存（Module 5）
  cache:
    enabled: true
    ocr-ttl-seconds: 3600
    rag-ttl-seconds: 1800
    predict-ttl-seconds: 600

# RAG服务配置
rag:
  service:
    url: ${flask.base-url}
    timeout-ms: ${flask.timeout-ms}

# Spring 配置
spring:
  application:
    name: mediacalbackend

  # 日志配置
  main:
    log-startup-info: true

  # 文件上传大小限制（支持 Base64 图片）
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # 数据源配置
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:medicalassistant}?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:appuser}
    # 数据库密码
    password: ${MYSQL_PASSWORD:App123456}
    # 驱动类名（MySQL 8.x）
    driver-class-name:  com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置（压测时默认 10 个连接不够用）
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:100}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000

  # redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 把 java 对象转为 redis 操作的网络包的一个驱动
#      password: ${REDIS_PASSWORD:null}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:40}
          max-idle: 20
          min-idle: 5
          max-wait: 3000ms

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: MANUAL
        # 消费者并发数（多线程消费）
        concurrency: 2
        max-concurrency: 5
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms

infra:
  async:
    queue-capacity: 500
    domain:
      core-size: 8
      max-size: 32
    ws-push:
      core-size: 8
      max-size: 32
    ai:
      core-size: ${AI_CORE_SIZE:32}
      max-size: ${AI_MAX_SIZE:64}
      queue-capacity: ${AI_QUEUE_CAPACITY:200}
    pdf:
      core-size: 2
      max-size: 8
  delay:
    redis:
      enabled: true
      poll-interval-ms: 1000
      batch-size: 100

# Sentinel 流控配置（压测时可调高 QPS 上限，通过 SENTINEL_FLOW_AGENT_CHAT_QPS 等环境变量覆盖）
sentinel:
  flow:
    agent-chat-qps: ${SENTINEL_FLOW_AGENT_CHAT_QPS:200}
    agent-chat-stream-qps: ${SENTINEL_FLOW_AGENT_CHAT_STREAM_QPS:200}
    agent-chat-stream-param-qps: ${SENTINEL_FLOW_AGENT_CHAT_STREAM_PARAM_QPS:200}
    ocr-qps: ${SENTINEL_FLOW_OCR_QPS:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump
  endpoint:
    health:
      probes:
        enabled: true

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.whu
  type-handlers-package: com.whu
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 阿里云 DashScope 配置 — 生产环境通过 DASHSCOPE_API_KEY 环境变量覆盖
dashscope:
  api-key: ${DASHSCOPE_API_KEY:sk-e7051a4ddaa049e9bd25c8264dfb3b15}
  # 多 Key 轮询：逗号分隔，优先级高于 api-key。如 DASHSCOPE_API_KEYS=sk-xxx1,sk-xxx2,sk-xxx3
  api-keys: ${DASHSCOPE_API_KEYS:}
  model: qwen-turbo  # 使用支持联网搜索的模型

# Redis Pub/Sub 判断的实例依据
app:
  instance-id: ${INSTANCE_ID:local}

service:
  websocket:
    enabled: true

# Agent 配置
agent:
  llm:
    enabled: true
  multi-turn:
    max-turns: 5
    timeout-ms: 30000
    retry-enabled: true
    max-retries: 2
  # Session 保留天数（超过此天数的 session 和消息会被自动清理）
  session:
    retention-days: ${SESSION_RETENTION_DAYS:3}
  # 全链路测试模式：开启动后 LLM 调用被跳过，只测本地管道耗时（不消耗 token）
  test:
    local-only: ${AGENT_TEST_LOCAL_ONLY:false}
  # 请求分级（Module 5）
  task:
    grading:
      L1-timeout-ms: 2000
      L2-timeout-ms: 10000
      L3-timeout-ms: 30000
      L4-timeout-ms: 120000

# Resilience4j 限流熔断配置（Module 5）
resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
    instances:
      llmChat:
        base-config: default
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms
    instances:
      flaskOcr:
        base-config: default
        limit-for-period: 30
      flaskRag:
        base-config: default
        limit-for-period: 50
      flaskPredict:
        base-config: default
        limit-for-period: 20
      llmChat:
        base-config: default
        limit-for-period: 20
      agentChat:
        base-config: default
        limit-for-period: 10
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      flaskOcr:
        base-config: default
      flaskRag:
        base-config: default
      flaskPredict:
        base-config: default
      llmChat:
        base-config: default

printpdf:
  output-dir: ./uploads/printpdf

# 日志配置
logging:
  level:
    root: INFO
    com.whu.medicalbackend: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet: DEBUG
