# 服务器配置
server:
  port: 8080
  # 最大 HTTP 请求大小（支持 Base64 图片）
  max-http-form-post-size: 50MB

# Flask AI service (云端服务)
flask:
  base-url: ${FLASK_URL:http://8.148.94.242:8001}
  timeout-ms: 120000
  # 客户端连接池（Module 5）
  client:
    connect-timeout-ms: 5000
    read-timeout-ms: 120000
    max-connections: 200
    max-connections-per-route: 50
    connection-ttl-ms: 300000
    keep-alive-ms: 60000

# AI 配置
ai:
  rag:
    base-url: ${flask.base-url}
    timeout-ms: ${flask.timeout-ms}
  # AI 缓存（Module 5）
  cache:
    enabled: true
    ocr-ttl-seconds: 3600
    rag-ttl-seconds: 1800
    predict-ttl-seconds: 600

# RAG服务配置
rag:
  service:
    url: ${flask.base-url}
    timeout-ms: ${flask.timeout-ms}

# Spring 配置
spring:
  application:
    name: mediacalbackend

  # 日志配置
  main:
    log-startup-info: true

  # 文件上传大小限制（支持 Base64 图片）
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # 数据源配置
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:medicalassistant}?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:appuser}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        concurrency: 2
        max-concurrency: 5
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms

infra:
  async:
    queue-capacity: 500
    domain:
      core-size: 8
      max-size: 32
    ws-push:
      core-size: 8
      max-size: 32
    ai:
      core-size: 8
      max-size: 20
      queue-capacity: 100
    pdf:
      core-size: 2
      max-size: 8
  delay:
    redis:
      enabled: false
      poll-interval-ms: 1000
      batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump
  endpoint:
    health:
      probes:
        enabled: true

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.whu
  type-handlers-package: com.whu
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 阿里云 DashScope 配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  model: qwen-turbo

# Redis Pub/Sub 判断的实例依据
app:
  instance-id: ${INSTANCE_ID:local}

service:
  websocket:
    enabled: true

# Agent 配置
agent:
  llm:
    enabled: true
  multi-turn:
    max-turns: 5
    timeout-ms: 30000
    retry-enabled: true
    max-retries: 2
  # 请求分级（Module 5）
  task:
    grading:
      L1-timeout-ms: 2000
      L2-timeout-ms: 10000
      L3-timeout-ms: 30000
      L4-timeout-ms: 120000

# Resilience4j 限流熔断配置（Module 5）
resilience4j:
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms
    instances:
      flaskOcr:
        base-config: default
        limit-for-period: 30
      flaskRag:
        base-config: default
        limit-for-period: 50
      flaskPredict:
        base-config: default
        limit-for-period: 20
      llmChat:
        base-config: default
        limit-for-period: 20
      agentChat:
        base-config: default
        limit-for-period: 10
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      flaskOcr:
        base-config: default
      flaskRag:
        base-config: default
      flaskPredict:
        base-config: default
      llmChat:
        base-config: default

printpdf:
  output-dir: ./uploads/printpdf

# 日志配置
logging:
  level:
    root: INFO
    com.whu.medicalbackend: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet: DEBUG
