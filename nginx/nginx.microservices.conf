worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Docker 容器重建后 IP 会变化；使用内置 DNS + 变量 proxy_pass 让 Nginx 运行时重新解析服务名。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Agent 服务使用 upstream 块以启用连接复用（keepalive），
    # 避免高并发下每请求建立新 TCP 连接导致的 502 错误。
    upstream agent_backend {
        server agent-service:8085;
        keepalive 64;            # 每 worker 保持的空闲长连接数
        keepalive_requests 1000; # 单连接最多复用次数
        keepalive_timeout 60s;
    }

    server {
        listen 80;
        server_name _;

        set $user_service http://user-service:8081;
        set $medication_service http://medication-service:8082;
        set $family_service http://family-service:8083;
        set $health_service http://health-service:8084;
        set $notification_service http://notification-service:8086;

        location /avatar/file/ {
            alias /usr/share/nginx/static/avatar/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /images/ {
            alias /usr/share/nginx/static/images/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /ws {
            proxy_pass $notification_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/user/ {
            proxy_pass $user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/api/(plan|task|medicine)(/|$) {
            proxy_pass $medication_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/medical/prepare/pdf/ {
            proxy_pass $medication_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/family/ {
            proxy_pass $family_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/health/ {
            proxy_pass $health_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SSE 流式接口：禁用缓冲，客户端才能实时收到 token；超时设为 5 分钟匹配服务端 SseEmitter。
        location /api/agent/chat/stream {
            proxy_pass http://agent_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no;
            add_header Cache-Control no-cache;
        }

        location /api/agent/ {
            proxy_pass http://agent_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location /api/rag/ {
            proxy_pass http://agent_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location /api/predict/ {
            proxy_pass http://agent_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location /api/ocr/ {
            proxy_pass http://agent_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
    }
}
